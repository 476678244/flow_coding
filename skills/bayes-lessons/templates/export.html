<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@@TITLE@@</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #fff;
  color: #141414;
  font: 15px/1.35 Palatino, "Iowan Old Style", "Songti SC", serif;
}
a.tag, a.all { color: inherit; text-decoration: none; }
a.tag:hover, a.all:hover { text-decoration: underline; text-underline-offset: 0.18em; }
a:focus-visible { outline: 2px solid #141414; outline-offset: 2px; }
.layout { display: grid; grid-template-columns: 17rem minmax(0, 1fr); min-height: 100vh; }
.layout.single { display: block; }
.layout.single main { max-width: 48rem; }
.taglist {
  position: sticky;
  top: 0;
  align-self: start;
  max-height: 100vh;
  overflow: auto;
  padding: 0.8rem 0.75rem 2rem;
  border-right: 1px solid #e4e4e4;
  background: #fff;
  font: 13px/1.35 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
}
.taglist a {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 0.45rem;
  width: 100%;
  padding: 0.38rem 0.2rem;
  color: #141414;
}
body:not(:has(.pick:target)) .taglist a.all {
  font-weight: 700;
  box-shadow: inset 2px 0 0 #141414;
  padding-left: 0.45rem;
}
.taglist a.child { padding-left: 1rem; }
.taglist a.lens { color: #8a4b00; }
.taglist a.lens + a.tag:not(.lens) { margin-top: 0.4rem; border-top: 1px solid #e4e4e4; }
.pick { position: absolute; width: 0; height: 0; overflow: hidden; }
.taglist .qlabel { overflow-wrap: anywhere; }
.taglist .qcount { font-variant-numeric: tabular-nums; color: #333; }
main { padding: 1.25rem 1.4rem 3rem; min-width: 0; }
header.sky { margin-bottom: 1rem; }
h1 { font-size: 1.12rem; font-weight: 600; margin: 0; }
.lead { margin: 0.2rem 0 0; font-size: 0.95rem; }
.questions { display: block; }
section { min-width: 0; scroll-margin-top: 0.6rem; }
.qh {
  display: flex;
  justify-content: space-between;
  gap: 0.75rem;
  align-items: baseline;
  border-bottom: 1px solid #141414;
  padding-bottom: 0.15rem;
}
h2 { flex: 1; min-width: 0; font-size: 0.98rem; line-height: 1.3; margin: 0; font-weight: 600; overflow-wrap: anywhere; }
h2 a.tag { font-weight: 600; color: #141414; }
.n { flex: none; font: 12px/1 ui-monospace, "SF Mono", Menlo, monospace; }
article {
  display: grid;
  grid-template-columns: 6.5rem minmax(0, 1fr);
  column-gap: 0.7rem;
  row-gap: 0.08rem;
  padding: 0.28rem 0 0.22rem;
  border-top: 1px solid #e4e4e4;
}
article[data-kind="fact"] { background: linear-gradient(90deg, rgba(236, 196, 112, 0.62), rgba(255, 255, 255, 0) 78%); }
article[data-kind="difference"] { background: linear-gradient(90deg, rgba(150, 194, 182, 0.66), rgba(255, 255, 255, 0) 78%); }
article[data-kind="bayesian"] { background: linear-gradient(90deg, rgba(214, 128, 64, 0.55), rgba(255, 255, 255, 0) 80%); }
article[data-kind="link"] { background: linear-gradient(90deg, rgba(160, 160, 170, 0.35), rgba(255, 255, 255, 0) 78%); }
article[data-state="retracted"] { background: linear-gradient(90deg, rgba(148, 144, 136, 0.38), rgba(255, 255, 255, 0) 78%); }
article[data-state="retracted"] h3 { text-decoration: line-through; color: #555; }
blockquote { grid-column: 2; margin: 0.1rem 0; padding-left: 0.5rem; border-left: 2px solid #ccc; font-size: 0.85rem; color: #333; overflow-wrap: anywhere; }
.lost { color: #b00020; }
.moved { color: #555; }
.over { grid-column: 2; margin: 0; font: 11px/1.35 ui-monospace, "SF Mono", Menlo, monospace; }
.meta { display: contents; }
.kind, .fid { font: 11px/1.35 ui-monospace, "SF Mono", Menlo, monospace; text-align: right; color: #222; }
.kind { grid-column: 1; grid-row: 1; }
.fid { grid-column: 1; grid-row: 2 / span 2; }
h3 {
  grid-column: 2;
  grid-row: 1;
  margin: 0;
  font-size: 0.95rem;
  font-weight: 500;
  min-width: 0;
  overflow-wrap: anywhere;
}
a.evidence, span.evidence {
  grid-column: 2;
  min-width: 0;
  font: 11px/1.35 ui-monospace, "SF Mono", Menlo, monospace;
  color: #222;
  overflow-wrap: anywhere;
}
.withdrawn { grid-column: 2; margin: 0.08rem 0 0; font: 11px/1.35 ui-monospace, "SF Mono", Menlo, monospace; }
.rowtags {
  grid-column: 2;
  margin: 0;
  font: 11px/1.35 ui-monospace, "SF Mono", Menlo, monospace;
  color: #222;
}
.qmark { margin-left: 0.3rem; }
.empty { margin: 0.4rem 0 0; }
body:has(.pick:target) #bags article { display: none; }
@@RULES@@
@media (max-width: 800px) {
  .layout { display: block; }
  .taglist { position: relative; max-height: 14rem; border-right: 0; border-bottom: 1px solid #e4e4e4; }
}
</style>
</head>
<body>
<div class="layout@@LAYOUT@@">
@@NAV@@
<main>
<header class="sky" id="top">
<h1 data-testid="page-title">@@TITLE@@</h1>
<p class="lead" data-testid="lead">格物：左侧每个柜子是事物自己的一类，点开就是这一类按事件时间排成的一张大表，不按记录的日期收纳。七彩：同柜里 difference、bayesian 那几块不一样的石头，点「七彩」只看它们。问号：吃不准的石头，可能是缩在壳里的小乌龟，等同柜下一条来验。灰色 link 是上次想过的一句，只供回看，不作先验。出处按原文片段重新定位，找不到标红。</p>
</header>
<p class="lead" data-testid="follow">@@FOLLOW@@</p>
<div id="bags">@@BAGS@@</div>
</main>
</div>
</body>
</html>
