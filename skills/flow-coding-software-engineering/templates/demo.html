<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>demo · __feature_id__ · 劳劳_RSS</title>
    <style>
      :root { --paper: #fcfbf9; --ink: #46423d; --muted: #9d9791; --line: #eeebe6; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font: 300 16px/1.7 "PingFang SC", "Hiragino Sans", "Helvetica Neue", sans-serif;
      }
      main { max-width: 36rem; margin: 0 auto; padding: 3rem 1.25rem 6rem; }
      h1 { font-weight: 400; font-size: 1.1rem; }
      p, li { color: var(--ink); }
      .muted { color: var(--muted); font-size: 0.85rem; }
      .card { border-top: 1px solid var(--line); padding: 1.25rem 0; }
      a { color: var(--ink); }
    </style>
  </head>
  <body>
    <main>
      <p class="muted">建议态 · 不是产品代码 · 纸色墨色</p>
      <h1 data-testid="demo-title">人看见什么</h1>
      <p class="muted">合同：看得见的 X → 跨过 &lt;边界&gt; → 仍能做 Y</p>
      <article class="card" data-testid="demo-primary">
        <p>主可见物（标题 / 列表行 / 按钮）。</p>
        <p class="muted">下一步：改 / 确认 / 刷新后仍能做。</p>
      </article>
    </main>
  </body>
</html>
